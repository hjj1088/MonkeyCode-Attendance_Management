<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>导出中心 - 考勤管理系统</title>
  <link rel="stylesheet" href="shared/bigsur.css">
  <style>
    [v-cloak] { display: none; }
    .export-layout { display: flex; gap: 20px; }
    .export-left { width: 200px; flex-shrink: 0; }
    .export-main { flex: 1; min-width: 0; }
    .export-right { width: 360px; flex-shrink: 0; }
    .template-item {
      padding: 8px 12px; border-radius: var(--radius-sm); font-size: 13px;
      cursor: pointer; transition: all 0.15s;
    }
    .template-item:hover { background: rgba(0,0,0,0.04); }
    .template-item.active { background: rgba(196,61,61,0.08); color: var(--vermillion); font-weight: 500; }
    .field-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
    .field-row input, .field-row select { padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-family: var(--font-sans); background: var(--card-bg); color: var(--text); }
    .field-row input:focus, .field-row select:focus { outline: none; border-color: var(--vermillion); }
    @media (max-width: 900px) { .export-layout { flex-direction: column; } .export-left, .export-right { width: 100%; } }
  </style>
</head>
<body>
<div id="app" v-cloak>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <div class="sidebar-brand">考勤管理</div>
      </div>
      <nav id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <button class="logout-btn" @click="handleLogout">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          退出登录
        </button>
      </div>
    </aside>
    <div id="sidebar-overlay" class="sidebar-overlay hidden" onclick="AppLayout.closeMenu()"></div>

    <main class="main-content">
      <header class="topbar">
        <button class="hamburger-btn" onclick="AppLayout.toggleMenu()">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span id="header-greeting"></span>
      </header>
      <div class="page-container">
        <div class="export-layout">

          <div class="export-left">
            <div class="card">
              <h3 style="font-size:14px;font-weight:600;margin-bottom:12px">模板列表</h3>
              <div style="display:flex;flex-direction:column;gap:2px;margin-bottom:12px">
                <div v-for="t in templates" :key="t.id" @click="selectTemplate(t)" class="template-item" :class="{ active: selectedTemplate && selectedTemplate.id === t.id }">{{ t.name }}</div>
              </div>
              <button @click="saveAsTemplate" class="btn btn-primary btn-sm" style="width:100%">另存为模板</button>
            </div>
          </div>

          <div class="export-main">
            <div class="card">
              <h3 style="font-size:14px;font-weight:600;margin-bottom:12px">模板字段编辑</h3>
              <div>
                <div v-for="(field, idx) in editingFields" :key="idx" class="field-row">
                  <input v-model="field.label" placeholder="列名" style="width:100px">
                  <select v-model="field.field" style="flex:1">
                    <option v-for="col in availableColumns" :key="col.field" :value="col.field">{{ col.label }}</option>
                  </select>
                  <button @click="removeField(idx)" class="btn btn-ghost btn-sm" style="color:var(--vermillion)">删除</button>
                </div>
              </div>
              <button @click="addField" class="btn btn-secondary btn-sm mt-sm">添加字段</button>
            </div>

            <div class="card">
              <h3 style="font-size:14px;font-weight:600;margin-bottom:12px">导出设置</h3>
              <div class="flex gap-sm flex-wrap" style="align-items:center">
                <select v-model="exportMonth" style="padding:6px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:var(--font-sans);background:var(--card-bg);color:var(--text)">
                  <option value="">导出: 全部月份</option>
                  <option v-for="m in availableMonths" :key="m" :value="m">{{ m }}</option>
                </select>
                <button @click="doExport" class="btn btn-primary btn-sm">导出 Excel</button>
                <button @click="doCalendarExport" :disabled="!exportMonth" class="btn btn-primary btn-sm">导出考勤明细</button>
              </div>
              <div style="font-size:11px;color:var(--text-secondary);margin-top:8px">
                考勤明细：日历格式，按模板字段输出。每天两行（上午/下午），上班打卡和下班打卡分列，含排班标注
              </div>
            </div>
          </div>

          <div class="export-right">
            <div class="card">
              <h3 style="font-size:14px;font-weight:600;margin-bottom:12px">实时预览 (前5条)</h3>
              <div v-if="previewData.length > 0" class="table-wrap">
                <table style="font-size:11px">
                  <thead><tr><th v-for="f in editingFields" :key="f.field" style="white-space:nowrap">{{ f.label }}</th></tr></thead>
                  <tbody>
                    <tr v-for="(row, ri) in previewData" :key="ri">
                      <td v-for="f in editingFields" :key="f.field" style="white-space:nowrap">
                        {{ f.field === '_index' ? ri + 1 : (row[f.field] !== undefined ? row[f.field] : '') }}
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <div v-else style="padding:24px;text-align:center;font-size:13px;color:var(--text-secondary)">暂无数据预览</div>
            </div>
          </div>

        </div>
      </div>
    </main>
  </div>
</div>

<script src="shared/dexie.min.js"></script>
<script src="shared/vue.min.js"></script>
<script src="shared/xlsx.min.js"></script>
<script src="shared/auth.js"></script>
<script src="shared/layout.js"></script>
<script src="shared/db.js"></script>
<script src="shared/excel.js"></script>
<script>
Auth.requireAuth();

const { createApp } = Vue;
createApp({
  data() { return {
    templates:[], selectedTemplate:null, editingFields:[], previewData:[],
    exportMonth:'', availableMonths:[],
    availableColumns: [
      { label:'序号(自动)', field:'_index' },
      { label:'考勤号码', field:'employeeNo' }, { label:'姓名', field:'name' }, { label:'部门', field:'department' },
      { label:'日期', field:'date' }, { label:'对应时段', field:'period' },
      { label:'上班时间', field:'scheduleStart' }, { label:'下班时间', field:'scheduleEnd' },
      { label:'签到时间', field:'signIn' }, { label:'签退时间', field:'signOut' },
      { label:'迟到时间', field:'lateMinutes' }, { label:'早退时间', field:'earlyMinutes' },
      { label:'加班时间', field:'overtimeHours' }, { label:'出差时间', field:'travelHours' },
      { label:'是否旷工', field:'absent' }, { label:'状态', field:'status' },
      { label:'请假类型', field:'leaveType' }, { label:'请假小时', field:'leaveHours' },
      { label:'工作时长', field:'workHours' }
    ]
  };},
  async created() { await this.loadTemplates(); await this.loadMonths(); },
  methods: {
    async loadTemplates() {
      this.templates = await DB.export_templates.toArray();
      if (this.templates.length) this.selectTemplate(this.templates[0]);
    },
    selectTemplate(t) {
      this.selectedTemplate = t;
      this.editingFields = JSON.parse(JSON.stringify(t.fields));
      this.updatePreview();
    },
    addField() {
      if (this.availableColumns.length) this.editingFields.push({ label:'', field:this.availableColumns[0].field });
    },
    removeField(idx) { this.editingFields.splice(idx, 1); this.updatePreview(); },
    async saveAsTemplate() {
      const name = prompt('请输入模板名称:');
      if (!name) return;
      await DB.export_templates.put({ name, isDefault:0, fields:JSON.parse(JSON.stringify(this.editingFields)) });
      await this.loadTemplates();
    },
    async updatePreview() {
      this.previewData = await DB.attendance_results.limit(5).toArray();
    },
    async loadMonths() {
      const results = await Store.getAll('attendance_results');
      const months = new Set(results.filter(r => r.month).map(r => r.month));
      this.availableMonths = [...months].sort();
      if (this.availableMonths.length) this.exportMonth = this.availableMonths[this.availableMonths.length - 1];
    },
    async doExport() {
      if (!this.editingFields.length) { alert('请至少添加一个导出字段'); return; }
      let records = this.exportMonth
        ? await Store.getByIndex('attendance_results', 'month', this.exportMonth)
        : await Store.getAll('attendance_results');
      if (!records.length) { alert('没有可导出的数据'); return; }
      const template = { fields: this.editingFields };
      const filename = this.exportMonth ? '考勤记录_'+this.exportMonth+'.xlsx' : '考勤记录_全部.xlsx';
      Excel.exportToExcel(records, template, filename);
    },
    async doCalendarExport() {
      if (!this.exportMonth) { alert('请先选择导出月份'); return; }
      if (!this.editingFields.length) { alert('请至少添加一个导出字段'); return; }
      try { await Excel.exportCalendarReport(this.exportMonth, this.editingFields); }
      catch (err) { alert('导出失败: ' + err.message); }
    },
    handleLogout() { Auth.logout(); }
  },
  watch: { editingFields:{ deep:true, handler(){ this.updatePreview(); } } }
}).mount('#app');
</script>
</body>
</html>
