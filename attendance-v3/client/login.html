<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考勤管理系统 - 登录</title>
  <link rel="stylesheet" href="shared/bigsur.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="flex-center mb-md">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--vermillion)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
      </div>
      <h1>考勤管理系统</h1>
      <p class="subtitle">Attendance Management</p>

      <div id="login-error" class="alert alert-error hidden"></div>

      <div class="form-group">
        <label class="form-label" for="username">用户名</label>
        <input type="text" id="username" class="form-input" placeholder="请输入用户名" autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">密码</label>
        <input type="password" id="password" class="form-input" placeholder="请输入密码" autocomplete="current-password">
      </div>

      <button id="login-btn" class="btn btn-primary" style="width:100%;justify-content:center;">登录</button>
      <div id="login-version" class="login-version" style="text-align:center;margin-top:16px;font-size:12px;color:var(--gray-5, #8a8f98);"></div>
    </div>
  </div>

  <script src="shared/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (Auth.isLoggedIn()) {
        window.location.href = 'attendance.html';
        return;
      }

      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const loginBtn = document.getElementById('login-btn');
      const errorEl = document.getElementById('login-error');

      usernameInput.focus();

      fetch('/api/system/version')
        .then(r => r.json())
        .then(res => {
          const v = res && res.data;
          if (v && v.version_name) {
            document.getElementById('login-version').textContent = 'V3.1 考勤管理系统';
          }
        })
        .catch(() => {});

      function showError(msg) {
        errorEl.textContent = msg;
        errorEl.classList.remove('hidden');
      }

      function hideError() {
        errorEl.classList.add('hidden');
      }

      function handleLogin() {
        hideError();
        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        if (!username || !password) {
          showError('请输入用户名和密码');
          return;
        }

        loginBtn.disabled = true;
        loginBtn.textContent = '登录中...';

        Auth.login(username, password).then(result => {
          if (result.success) {
            localStorage.setItem('attendance_user', username);
            if (result.needChangePassword) {
              sessionStorage.setItem('need_change_password', '1');
            } else {
              sessionStorage.removeItem('need_change_password');
            }
            window.location.href = '/';
          } else {
            showError(result.message || '账号或密码错误');
            loginBtn.disabled = false;
            loginBtn.textContent = '登录';
          }
        });
      }

      loginBtn.addEventListener('click', handleLogin);

      passwordInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') handleLogin();
      });

      usernameInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') passwordInput.focus();
      });
    });
  </script>
</body>
</html>
