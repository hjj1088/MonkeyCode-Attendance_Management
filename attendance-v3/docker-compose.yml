services:
  attendance:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: ghcr.io/hjj1088/monkeycode-attendance_management-v3:latest
    container_name: attendance-v3
    ports:
      - "${HOST_PORT:-8001}:8001"
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data:/app/server/data
    restart: unless-stopped
